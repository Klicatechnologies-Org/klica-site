# Netlify configuration for the Klica site.
#
# Netlify builds this itself from the repo -- no local deploy needed.

[build]
  # The Astro project lives in site/; publish is relative to base.
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# app-ads.txt is the whole reason this migration exists. AdMob will only accept
# it as plain text over HTTP 200, so pin the content type explicitly rather than
# trusting extension sniffing. Short cache so corrections propagate quickly.
[[headers]]
  for = "/app-ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Immutable hashed assets can be cached hard.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The old Apps pages were folded into the download section on the home page.
[[redirects]]
  from = "/apps"
  to = "/#download"
  status = 301

[[redirects]]
  from = "/apps/*"
  to = "/#download"
  status = 301
